name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies (curl, wget, libssl1.1)
      run: |
        apt-get update
        apt-get install curl wget libssl1.1 -y 
    
    - name: Install Java for Embold Scanner
      run: |
        apt-get install openjdk-11-jre -y
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    # NEW STEP: Find .sln file and build it automatically
    - name: Find and Build Solution
      run: |
        echo "Searching for .sln files..."
        # Find the first .sln file in the repository
        SOLUTION_FILE=$(find . -name "*.sln" | head -n 1)
        
        if [ -z "$SOLUTION_FILE" ]; then
          echo "No .sln file found! Listing all files to help debug:"
          find . -maxdepth 3 -not -path '*/.*'
          exit 1
        else
          echo "Found solution file: $SOLUTION_FILE"
          echo "Building..."
          # We add '|| true' because Windows projects (UWP/WPF) often fail to build on Linux.
          # This allows the workflow to continue to the Embold Analysis step.
          dotnet restore "$SOLUTION_FILE"
          dotnet build "$SOLUTION_FILE" --configuration Release || echo "Build failed (likely platform mismatch), but proceeding to analysis..."
        fi

    - name: Create Log Folder and Set Permissions
      run: |
        mkdir -p ./embold-log
        chmod 777 ./embold-log
        
    - name: Embold Analyse
      run: |
        curl ${{ vars.EMBOLD_SCANNER_URL }} -o browserstack-codequality-scanner-archive.tar.gz
        tar xvf browserstack-codequality-scanner-archive.tar.gz
        curl --silent --location --request GET "${{ vars.EMBOLD_URL_CS }}/api/v1/repositories/20e887e9eb47799dc6c2a4d916641b24/scans/config/download" --header "Authorization:Bearer ${{ secrets.EMBOLD_TOKEN_CS}}" -o repository-configuration.json
        ./browserstack-codequality-scanner/bin/embold-scanner analyse -u ${{ vars.EMBOLD_URL_CS }} -t "${{ secrets.EMBOLD_TOKEN_CS }}" -r 20e887e9eb47799dc6c2a4d916641b24 -b . -d ./embold-data -c ./repository-configuration.json -v
