name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies (curl, wget, libssl1.1)
      run: |
        apt-get update
        apt-get install curl wget libssl1.1 -y 
    
    - name: Install Java for Embold Scanner
      run: |
        apt-get install openjdk-11-jre -y
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x # UPDATED: DevToys 2.0 requires .NET 8
        
    # NEW STEP: Build the Linux-compatible CLI project
    # Note: Building the full .sln on Linux often fails because it includes Windows-only (WPF) projects.
    # We target the CLI project to ensure the core logic is built and analyzed.
    - name: Build DevToys CLI
      run: |
        dotnet restore src/DevToys.CLI/DevToys.CLI.csproj
        dotnet build src/DevToys.CLI/DevToys.CLI.csproj --configuration Release

    - name: Create Log Folder and Set Permissions
      run: |
        echo "Creating log directory..."
        mkdir -p ./embold-log
        
        echo "Setting permissions to 777..."
        chmod 777 ./embold-log
        
        echo "Verifying permissions..."
        ls -ld ./embold-log
        
    - name: Embold Analyse
      run: |
        curl ${{ vars.EMBOLD_SCANNER_URL }} -o browserstack-codequality-scanner-archive.tar.gz
        tar xvf browserstack-codequality-scanner-archive.tar.gz
        echo "Download and extract BrowserStack CQ Scanner done"
        curl --silent --location --request GET "${{ vars.EMBOLD_URL_CS }}/api/v1/repositories/20e887e9eb47799dc6c2a4d916641b24/scans/config/download" --header "Authorization:Bearer ${{ secrets.EMBOLD_TOKEN_CS}}" -o repository-configuration.json
        echo "Download repository configuration file done"
        ./browserstack-codequality-scanner/bin/embold-scanner.bat analyse -u ${{ vars.EMBOLD_URL_CS }} -t "${{ secrets.EMBOLD_TOKEN_CS }}" -r 20e887e9eb47799dc6c2a4d916641b24 -b . -d ./embold-data -c ./repository-configuration.json -v
